[project]
name = "yt-tool"
version = "0.2.0"
description = "Turn public YouTube playlists into clean, downloadable study notes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "kaif-ai-engineer" }]
keywords = ["youtube", "transcripts", "study-notes", "streamlit", "yt-dlp"]
dependencies = [
    "requests>=2.31.0",
    "streamlit>=1.40.0",
    "youtube-transcript-api>=1.2.0",
    "yt-dlp>=2024.10.0",
]

[project.urls]
Homepage = "https://github.com/kaif-ai-engineer/transcript-studio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_tool"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
